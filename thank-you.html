<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Thank You - Portfolio</title>
  <meta name="description" content="Thank you for contacting me">
  <meta name="keywords" content="contact, thank you, portfolio">

  <!-- Favicons -->
  <link href="assets/favicon/q.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="assets/css/main.css" rel="stylesheet">
</head>

<body class="thank-you-page">

  <main class="main">
    <section class="thank-you-section">
      <div class="container">
        <div class="row justify-content-center text-center">
          <div class="col-lg-8">
            <div class="thank-you-content" data-aos="fade-up">
              <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem; margin-bottom: 2rem;"></i>
              <h1 class="mb-4">Thank You!</h1>
              <p class="lead mb-4">Your message has been successfully sent. I'll get back to you as soon as possible.</p>
              <p class="mb-5">I appreciate you taking the time to contact me and look forward to connecting with you.</p>
              <a href="index.html" class="btn btn-primary btn-lg">
                <i class="bi bi-arrow-left me-2"></i>Back to Portfolio
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <style>
    .thank-you-page {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 30%, #21262d 60%, #1a202c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .thank-you-section {
      padding: 80px 0;
    }
    
    .thank-you-content {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 60px 40px;
      color: white;
    }
    
    .thank-you-content h1 {
      color: #74c0fc;
      font-weight: 700;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #74c0fc, #4dabf7);
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, #4dabf7, #74c0fc);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(116, 192, 252, 0.4);
    }
  </style>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>

  <!-- Main JS File -->
  <script>
    // Initialize AOS
    AOS.init({
      duration: 600,
      easing: 'ease-in-out',
      once: true,
      mirror: false
    });
  </script>

</body>

</html>
